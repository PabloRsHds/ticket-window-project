services:
  postgres:
    image: postgres:16
    container_name: queue-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./queue-backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./queue-backend
      dockerfile: Dockerfile

    container_name: queue-backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      FRONTEND_URL: ${FRONTEND_URL}
      FRONTEND_PORT: ${FRONTEND_PORT}

      PUBLIC_KEY: ${PUBLIC_KEY}
      PRIVATE_KEY: ${PRIVATE_KEY}

      ADM_1_EMAIL: ${ADM_1_EMAIL}
      ADM_1_PASSWORD: ${ADM_1_PASSWORD}
      ADM_1_USERNAME: ${ADM_1_USERNAME}
      ADM_1_NAME: ${ADM_1_NAME}
      ADM_1_SURNAME: ${ADM_1_SURNAME}

    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"

  frontend:
    build:
      context: ./queue-frontend
      dockerfile: Dockerfile

    container_name: queue-frontend
    restart: unless-stopped

    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}

    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"

    depends_on:
      - backend

volumes:
  postgres_data: